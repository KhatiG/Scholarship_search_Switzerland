<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Funding Finder — Refugees & Asylum Seekers in Switzerland</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEF1F4; --card:#FFFFFF; --ink:#16242C; --muted:#57686F; --line:#D6DEE4;
    --brand:#0E6E6E; --brand-ink:#0A4F4F;
    --open:#2E8B62; --open-bg:#E7F3EC; --open-line:#BFE1CD;
    --verify:#B07C1E; --verify-bg:#FBF2DC; --verify-line:#EBD79E;
    --closed:#A8514B; --closed-bg:#F7E9E7; --closed-line:#E7C6C2;
    --info:#5E7480; --info-bg:#EAEFF2; --info-line:#CFDAE0;
    --later:#5B5AA6; --later-bg:#ECECF7; --later-line:#CFCFEC;
    --shadow:0 1px 2px rgba(20,40,50,.05),0 6px 20px rgba(20,40,50,.06);
    --radius:14px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1120px;margin:0 auto;padding:0 22px}
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace}

  header.hero{padding:22px 0 26px;border-bottom:1px solid var(--line)}
  .topbar{display:flex;justify-content:flex-end;align-items:center;padding-top:6px}
  .lang{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
  .lang button{border:0;background:transparent;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;
    color:var(--muted);padding:5px 10px;border-radius:5px;cursor:pointer;letter-spacing:.04em}
  .lang button[aria-pressed="true"]{background:var(--brand);color:#fff}
  .lang button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--brand);font-weight:600;margin:26px 0 14px}
  h1{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:clamp(30px,5vw,50px);line-height:1.04;
    letter-spacing:-.01em;margin:0 0 14px;max-width:18ch}
  .lede{font-size:clamp(16px,2.2vw,18px);color:var(--muted);max-width:62ch;margin:0}

  .permit-block{margin-top:30px}
  .permit-q{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 10px;text-transform:uppercase;letter-spacing:.06em}
  .permits{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:660px}
  .permit{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 10px 11px;text-align:left;
    cursor:pointer;transition:.18s ease;display:flex;flex-direction:column;gap:3px;font-family:inherit}
  .permit:hover{border-color:#9fb4bd;transform:translateY(-1px)}
  .permit:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px}
  .permit .code{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:20px;color:var(--ink)}
  .permit .lab{font-size:11.5px;color:var(--muted);line-height:1.25}
  .permit[aria-pressed="true"]{border-color:var(--brand);background:#F2F9F8;box-shadow:0 0 0 3px rgba(14,110,110,.10)}
  .permit[aria-pressed="true"] .code{color:var(--brand-ink)}
  .tally{margin-top:18px;font-size:15px;color:var(--muted);min-height:22px}
  .tally b{color:var(--ink);font-weight:600}
  .tally .num{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--open)}

  .filters{position:sticky;top:0;z-index:20;background:rgba(238,241,244,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:14px 0}
  .filters .wrap{display:flex;flex-wrap:wrap;gap:18px 26px;align-items:flex-end}
  .fgroup{display:flex;flex-direction:column;gap:6px}
  .fgroup>span{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
  .seg button{border:0;background:transparent;font-family:inherit;font-size:13.5px;color:var(--muted);
    padding:6px 12px;border-radius:6px;cursor:pointer;transition:.15s;white-space:nowrap}
  .seg button:hover{color:var(--ink)}
  .seg button[aria-pressed="true"]{background:var(--brand);color:#fff;font-weight:500}
  .seg button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  .toggles{display:flex;flex-direction:column;gap:7px}
  .tog{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink);cursor:pointer;user-select:none}
  .tog input{accent-color:var(--brand);width:15px;height:15px;cursor:pointer}
  .search{flex:1;min-width:180px}
  .search input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-family:inherit;
    font-size:14px;background:var(--card);color:var(--ink)}
  .search input:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:var(--brand)}

  main{padding:30px 0 10px}
  .grouphead{display:flex;align-items:center;gap:12px;margin:30px 0 14px}
  .grouphead:first-child{margin-top:4px}
  .grouphead h2{font-family:'Fraunces',serif;font-weight:500;font-size:22px;margin:0;letter-spacing:-.01em}
  .grouphead .count{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--muted)}
  .grouphead .rule{flex:1;height:1px;background:var(--line)}
  .dot{width:10px;height:10px;border-radius:50%;flex:none}
  .dot.open{background:var(--open)} .dot.verify{background:var(--verify)}
  .dot.closed{background:var(--closed)} .dot.info{background:var(--info)} .dot.later{background:var(--later)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 16px;
    box-shadow:var(--shadow);border-left:4px solid var(--line);display:flex;flex-direction:column;gap:10px;
    transition:transform .16s ease,box-shadow .16s ease}
  .card:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(20,40,50,.06),0 12px 28px rgba(20,40,50,.10)}
  .card.open{border-left-color:var(--open)} .card.verify{border-left-color:var(--verify)}
  .card.closed{border-left-color:var(--closed)} .card.info{border-left-color:var(--info)} .card.later{border-left-color:var(--later)}
  .card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .card h3{font-size:16.5px;font-weight:600;margin:0;line-height:1.25;letter-spacing:-.005em}
  .seal{font-size:11px;font-weight:600;padding:4px 9px;border-radius:20px;white-space:nowrap;border:1px solid;letter-spacing:.01em}
  .seal.open{color:var(--open);background:var(--open-bg);border-color:var(--open-line)}
  .seal.verify{color:var(--verify);background:var(--verify-bg);border-color:var(--verify-line)}
  .seal.closed{color:var(--closed);background:var(--closed-bg);border-color:var(--closed-line)}
  .seal.info{color:var(--info);background:var(--info-bg);border-color:var(--info-line)}
  .seal.later{color:var(--later);background:var(--later-bg);border-color:var(--later-line)}
  .badges{display:flex;flex-wrap:wrap;gap:6px}
  .badge{font-size:11px;color:var(--muted);background:#F1F5F7;border:1px solid var(--line);border-radius:6px;padding:2px 8px}
  .badge.women{color:#8a3d6b;background:#faeef4;border-color:#efcfdf}
  .amount{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink);font-weight:600}
  .rows{display:flex;flex-direction:column;gap:7px;margin-top:2px}
  .row{display:grid;grid-template-columns:82px 1fr;gap:10px;font-size:13.5px}
  .row .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding-top:1px}
  .row .v{color:var(--ink)}
  .fit{font-size:13.5px;color:var(--ink);background:#F5F8F8;border-radius:9px;padding:9px 11px;border:1px solid #E1EBEB}
  .card a.link{font-size:13px;color:var(--brand);text-decoration:none;font-weight:500;display:inline-flex;
    align-items:center;gap:5px;margin-top:1px;width:fit-content}
  .card a.link:hover{text-decoration:underline}
  .card a.link::after{content:"↗";font-size:12px}

  details.mismatch-wrap{margin:34px 0 0}
  details.mismatch-wrap>summary{cursor:pointer;font-family:'Fraunces',serif;font-size:20px;color:var(--muted);
    list-style:none;display:flex;align-items:center;gap:10px}
  details.mismatch-wrap>summary::-webkit-details-marker{display:none}
  details.mismatch-wrap>summary::before{content:"›";font-size:22px;transition:.2s;display:inline-block}
  details.mismatch-wrap[open]>summary::before{transform:rotate(90deg)}
  details .grid{margin-top:14px}

  .empty{text-align:center;padding:50px 20px;color:var(--muted)}
  .empty h2{font-family:'Fraunces',serif;color:var(--ink);font-weight:500;margin:0 0 8px}

  .strip{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;
    margin:40px 0 10px;box-shadow:var(--shadow)}
  .strip h2{font-family:'Fraunces',serif;font-weight:500;font-size:22px;margin:0 0 12px}
  .strip ol{margin:0;padding-left:20px;display:grid;gap:9px}
  .strip li{font-size:14.5px}
  .strip li b{color:var(--brand-ink)}
  footer{border-top:1px solid var(--line);margin-top:40px;padding:26px 0 60px;color:var(--muted);font-size:13px}
  footer p{margin:0 0 8px;max-width:80ch}

  @media (max-width:560px){
    .permits{grid-template-columns:repeat(2,1fr)}
    .row{grid-template-columns:74px 1fr}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto}}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <div class="topbar">
      <div class="lang" id="lang" role="group" aria-label="Language">
        <button data-lang="en" aria-pressed="true">EN</button>
        <button data-lang="de" aria-pressed="false">DE</button>
      </div>
    </div>
    <p class="eyebrow" data-i18n="eyebrow"></p>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>

    <div class="permit-block">
      <p class="permit-q" data-i18n="permitQ"></p>
      <div class="permits" id="permits" role="group" aria-label="Permit">
        <button class="permit" data-permit="N" aria-pressed="true"><span class="code">N</span><span class="lab" data-i18n="labN"></span></button>
        <button class="permit" data-permit="F" aria-pressed="false"><span class="code">F</span><span class="lab" data-i18n="labF"></span></button>
        <button class="permit" data-permit="B" aria-pressed="false"><span class="code">B</span><span class="lab" data-i18n="labB"></span></button>
        <button class="permit" data-permit="C" aria-pressed="false"><span class="code">C</span><span class="lab" data-i18n="labC"></span></button>
      </div>
      <p class="tally" id="tally"></p>
    </div>
  </div>
</header>

<div class="filters">
  <div class="wrap">
    <div class="fgroup"><span data-i18n="fField"></span>
      <div class="seg" id="field" role="group">
        <button data-field="all" aria-pressed="true" data-i18n="segAll"></button>
        <button data-field="business" aria-pressed="false" data-i18n="segBusiness"></button>
        <button data-field="engineering" aria-pressed="false" data-i18n="segEng"></button>
      </div>
    </div>
    <div class="fgroup"><span data-i18n="fLoc"></span>
      <div class="seg" id="loc" role="group">
        <button data-loc="all" aria-pressed="true" data-i18n="locAll"></button>
        <button data-loc="bern" aria-pressed="false" data-i18n="locBern"></button>
        <button data-loc="ch" aria-pressed="false" data-i18n="locCH"></button>
        <button data-loc="online" aria-pressed="false" data-i18n="locOnline"></button>
      </div>
    </div>
    <div class="fgroup"><span data-i18n="fRefine"></span>
      <div class="toggles">
        <label class="tog"><input type="checkbox" id="womenOnly"> <span data-i18n="togWomen"></span></label>
        <label class="tog"><input type="checkbox" id="moveOn"> <span data-i18n="togMove"></span></label>
      </div>
    </div>
    <div class="fgroup search"><span data-i18n="fSearch"></span>
      <div class="search"><input type="search" id="q" data-i18n-ph="searchPh" aria-label="Search"></div>
    </div>
  </div>
</div>

<main>
  <div class="wrap" id="results"></div>
  <div class="wrap">
    <div class="strip">
      <h2 data-i18n="stratTitle"></h2>
      <ol>
        <li data-i18n="strat1"></li><li data-i18n="strat2"></li><li data-i18n="strat3"></li><li data-i18n="strat4"></li>
      </ol>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <p data-i18n="foot1"></p>
    <p data-i18n="foot2"></p>
  </div>
</footer>

const RANK={N:0,F:1,B:2,C:3};
const state={lang:"en",permit:"N",field:"all",loc:"all",women:false,move:false,q:""};
const T=()=>I18N[state.lang];
const womenRe=/women|frauen|migrant|migrantinnen/i;

function statusFor(it,permit){
  if(it.kind==="service") return "info";
  if(it.later) return "later";
  if(it.permits.length===0) return "closed";
  if(it.permits.includes(permit)) return it.verify?"verify":"open";
  return "closed";
}
function passesFilters(it){
  if(state.field!=="all" && !(it.fields.includes(state.field)||it.fields.includes("any"))) return false;
  if(state.loc!=="all" && it.scope!==state.loc) return false;
  if(!state.move && it.scope==="move") return false;
  if(state.women && !it.women) return false;
  if(state.q){
    const L=state.lang;
    const hay=(it.name[L]+" "+it.who[L]+" "+it.covers[L]+" "+it.fit[L]+" "+it.badges[L].join(" ")).toLowerCase();
    if(!hay.includes(state.q.toLowerCase())) return false;
  }
  return true;
}
function cardHTML(it,st){
  const L=state.lang, t=T();
  const seal={open:t.sealOpen,verify:t.sealVerify,info:t.sealService,later:t.sealLater,
    closed:(it.permits.length? t.sealOpensAt+it.permits.slice().sort((a,b)=>RANK[a]-RANK[b])[0] : t.sealNoMatch)}[st];
  const badges=it.badges[L].map(b=>`<span class="badge${womenRe.test(b)?' women':''}">${b}</span>`).join("");
  const openHint=(st==="closed"&&it.permits.length)
    ?`<div class="row"><div class="k">${t.kOpensAt}</div><div class="v mono">${it.permits.slice().sort((a,b)=>RANK[a]-RANK[b]).join(" · ")}</div></div>`:"";
  const reason=it.reason?`<div class="row"><div class="k">${t.kWhy}</div><div class="v">${it.reason[L]}</div></div>`:"";
  const dash="—";
  const terms=(it.terms[L]&&it.terms[L]!==dash)?`<div class="row"><div class="k">${t.kApply}</div><div class="v">${it.terms[L]}</div></div>`:"";
  const dl=(it.deadline[L]&&it.deadline[L]!==dash)?`<div class="row"><div class="k">${t.kDeadline}</div><div class="v">${it.deadline[L]}</div></div>`:"";
  const link=it.link?`<a class="link" href="${it.link}" target="_blank" rel="noopener">${t.openSite}</a>`:"";
  return `<article class="card ${st}">
    <div class="top"><h3>${it.name[L]}</h3><span class="seal ${st}">${seal}</span></div>
    <div class="badges">${badges}</div>
    <div class="amount">${it.amount[L]||""}</div>
    <div class="rows">
      <div class="row"><div class="k">${t.kWho}</div><div class="v">${it.who[L]}</div></div>
      <div class="row"><div class="k">${t.kCovers}</div><div class="v">${it.covers[L]}</div></div>
      ${terms}${dl}${openHint}${reason}
    </div>
    <div class="fit">${it.fit[L]}</div>${link}
  </article>`;
}
function render(){
  const t=T();
  const visible=DATA.filter(passesFilters);
  const b={open:[],verify:[],later:[],closed:[],info:[]};
  visible.forEach(it=>b[statusFor(it,state.permit)].push(it));
  const opensHigher=b.closed.filter(it=>it.permits.length>0);
  const mismatch=b.closed.filter(it=>it.permits.length===0);

  const tally=document.getElementById("tally");
  tally.innerHTML = visible.length===0 ? t.tallyEmpty : t.tally(state.permit,b.open.length,b.verify.length,visible.length);

  const groups=[["open","open",t.gOpen],["verify","verify",t.gVerify],["later","later",t.gLater],["closed","closed",t.gClosed],["info","info",t.gInfo]];
  let html="";
  for(const [key,cls,title] of groups){
    const items = key==="closed"?opensHigher:b[key];
    if(!items.length) continue;
    html+=`<div class="grouphead"><span class="dot ${cls}"></span><h2>${title}</h2><span class="count">${items.length}</span><span class="rule"></span></div>`;
    html+=`<div class="grid">${items.map(it=>cardHTML(it,key)).join("")}</div>`;
  }
  if(mismatch.length){
    html+=`<details class="mismatch-wrap"><summary>${t.mismatch(mismatch.length)}</summary><div class="grid">${mismatch.map(it=>cardHTML(it,"closed")).join("")}</div></details>`;
  }
  if(visible.length===0){
    html=`<div class="empty"><h2>${t.emptyH}</h2><p>${t.emptyP}</p></div>`;
  }
  document.getElementById("results").innerHTML=html;
}
function applyI18n(){
  const t=T();
  document.documentElement.lang=state.lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{el.innerHTML=t[el.dataset.i18n]??"";});
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>{el.placeholder=t[el.dataset.i18nPh]??"";});
}

// wiring
function seg(id,key){document.getElementById(id).addEventListener("click",e=>{const btn=e.target.closest("button");if(!btn)return;
  document.querySelectorAll(`#${id} button`).forEach(x=>x.setAttribute("aria-pressed","false"));btn.setAttribute("aria-pressed","true");
  state[key]=btn.dataset[key];render();});}
document.getElementById("permits").addEventListener("click",e=>{const b=e.target.closest(".permit");if(!b)return;
  document.querySelectorAll("#permits .permit").forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");
  state.permit=b.dataset.permit;render();});
document.getElementById("lang").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  document.querySelectorAll("#lang button").forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");
  state.lang=b.dataset.lang;applyI18n();render();});
seg("field","field");seg("loc","loc");
document.getElementById("womenOnly").addEventListener("change",e=>{state.women=e.target.checked;render();});
document.getElementById("moveOn").addEventListener("change",e=>{state.move=e.target.checked;render();});
document.getElementById("q").addEventListener("input",e=>{state.q=e.target.value;render();});

applyI18n();render();
</script>
